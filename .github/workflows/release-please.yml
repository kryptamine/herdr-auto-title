name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to build and publish, such as v1.2.3
        required: false

permissions:
  contents: write
  pull-requests: write

# A run must not see another run's draft while its binaries are being attached.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with GITHUB_TOKEN starts no workflow, so the binaries are built
  # here. The release stays a draft until they are attached, so nobody is told
  # of a release an install cannot download yet; see installation.md.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # Installs have already checked a published release's files, so never replace them.
      - name: Refuse anything but a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::$TAG is not a draft release, so nothing here may replace its files"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: make dist
      # SHA256SUMS comes from the same release as the binary, so it proves only
      # that a download is intact; this says the release workflow built it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attach and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest

  # stable follows the latest published release on every run, so any later run
  # repairs a failed move. No force, so it can never move back.
  stable:
    needs: binaries
    if: ${{ !cancelled() && needs.binaries.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Move stable to the latest release
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
          # Answers [] when stable is missing, so any other error fails the step.
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/heads/stable" \
            --jq 'map(select(.ref == "refs/heads/stable")) | length')
          if [ "$refs" = 1 ]; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/stable" -f sha="$sha"
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/stable -f sha="$sha"
          fi
      # Re-running all jobs skips binaries, so a stuck draft would otherwise go
      # unnoticed behind green runs; see installation.md for the way out.
      - name: Fail while a release is a draft
        run: |
          drafts=$(gh release list --json isDraft,tagName --jq 'map(select(.isDraft)) | .[].tagName')
          for tag in $drafts; do
            echo "::error::$tag is still a draft. To publish it: gh workflow run release-please.yml -f tag=$tag. If it cannot build or a newer release is out: gh release delete $tag"
          done
          [ -z "$drafts" ]
