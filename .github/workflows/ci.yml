name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what go.mod and the README promise; an install with no
        # release binary builds the plugin from source, so breaking it matters.
        go-version: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # Every release target, as the release job builds them, so one that
      # stopped building shows up here rather than on the day of a release.
      - run: make dist

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Not in the matrix above: tools/go.mod needs a newer Go than the
          # plugin does, and the linter's findings do not vary by version.
          go-version: stable
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Formatting
        # `make fmt` rewrites; CI has to fail instead. It lives beside the
        # linter because the formatters are configured in .golangci.yml too.
        run: go tool -modfile=tools/go.mod golangci-lint fmt --diff ./...
      - run: make lint
      # The runner ships shellcheck; install.ps1 is analyzed on Windows below.
      - run: make lint-scripts

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -race ./...

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go build ./...
      # The race detector needs cgo on Windows, and the runner ships gcc.
      - run: go test -race ./...

  install:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path scripts/install.ps1 -EnableExit
      - run: python scripts/test_install.py
